# ============================================================
# experiment.yaml — Master configuration
# Shared by BOTH Monolithic and PatternRAG systems.
# Do NOT add system-specific settings here.
# ============================================================

experiment:
  seed: 42
  num_queries: 500
  dataset_split: "validation"   # HotpotQA split

retrieval:
  top_k: 10
  # Hybrid retrieval uses standard Reciprocal Rank Fusion (no alpha weight).
  # RRF rank combination formula: score(d) = sum(1 / (k + rank_i(d)))
  # with k=60 (standard constant).
  rrf_k: 60

embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  local_files_only: true

llm:
  provider: "groq"
  model_name: "openai/gpt-oss-120b"
  max_tokens: 256
  temperature: 0.0
  inter_query_delay: 2.0  # Seconds between successful LLM requests
  max_retries: 5          # Bounded retries for 429 / connection errors
  initial_backoff: 2.0    # Exponential backoff base in seconds

paths:
  artifacts_dir: "./artifacts"
  results_dir: "./results"
